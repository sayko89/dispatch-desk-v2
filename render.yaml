# Render Blueprint for the bonus server consumer (free plan).
services:
  - type: web
    name: dispatch-desk-v2-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Optional: load the pinned Hugging Face copy instead of the bundled model/.
      # - key: MODEL_BASE
      #   value: https://huggingface.co/saiyko/dispatch-desk-risk/resolve/<commit>/
