<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Dispatch Desk v2</title>
<desc id="d">Dispatch Desk v2: an on-device model reads how you play. A sigmoid risk curve with a 0.5 threshold; players above the line get a support card.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07061A"/><stop offset="1" stop-color="#140B33"/>
  </linearGradient>
  <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22F0A3"/><stop offset=".5" stop-color="#FFC53D"/><stop offset="1" stop-color="#FF2D55"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2A2160"/></pattern>
  <style>
    .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:"Chakra Petch","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    .run{stroke-dasharray:900;stroke-dashoffset:900;animation:d 2.2s ease-out forwards}
    @keyframes d{to{stroke-dashoffset:0}}
  </style>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#dots)" opacity=".6"/>

<!-- left: title -->
<g transform="translate(64,92)">
  <text class="mono" x="0" y="0" font-size="15" letter-spacing="3" fill="#AE8FFF">YZM301 · THE PRIMER v2 · ON-DEVICE ML</text>
  <text class="sans" x="0" y="74" font-size="66" font-weight="700" fill="#EDEBFF" letter-spacing="2">DISPATCH DESK</text>
  <g transform="translate(0,96)">
    <rect width="92" height="50" rx="10" fill="none" stroke="#FFC53D" stroke-width="2" filter="url(#glow)"/>
    <text class="sans" x="46" y="36" text-anchor="middle" font-size="34" font-weight="700" fill="#FFC53D">v2</text>
    <text class="sans" x="114" y="34" font-size="26" fill="#C9C3F2">the game reads how you play</text>
  </g>
  <text class="mono" x="0" y="206" font-size="15" fill="#8C86B8">p = P(costly choice | play so far)   ·   p ≥ 0.50 → support card</text>
  <g class="mono" font-size="13" transform="translate(0,236)">
    <rect width="150" height="28" rx="14" fill="#1C1546" stroke="#3A2F7A"/><text x="75" y="19" text-anchor="middle" fill="#22F0A3">ROC AUC 0.761</text>
    <rect x="162" width="150" height="28" rx="14" fill="#1C1546" stroke="#3A2F7A"/><text x="237" y="19" text-anchor="middle" fill="#25E2FF">|Δ| &lt; 1e-4</text>
    <rect x="324" width="150" height="28" rx="14" fill="#1C1546" stroke="#3A2F7A"/><text x="399" y="19" text-anchor="middle" fill="#FFC53D">593 B · browser</text>
  </g>
</g>

<!-- right: risk curve -->
<g transform="translate(700,60)">
  <rect width="440" height="280" rx="16" fill="#0E0A28" stroke="#2E2566"/>
  <text class="mono" x="20" y="30" font-size="12" letter-spacing="2" fill="#8C86B8">RISK MODEL · CRISIS SCENE</text>
  <g transform="translate(40,50)">
    <line x1="0" y1="200" x2="370" y2="200" stroke="#2E2566"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#2E2566"/>
    <line x1="0" y1="100" x2="370" y2="100" stroke="#FFC53D" stroke-dasharray="6 6" opacity=".8"/>
    <text class="mono" x="372" y="96" font-size="11" fill="#FFC53D" text-anchor="end">τ = 0.50</text>
    <text class="mono" x="-8" y="6" font-size="11" fill="#5F5994" text-anchor="end">1</text>
    <text class="mono" x="-8" y="204" font-size="11" fill="#5F5994" text-anchor="end">0</text>
    <path class="run" d="M0,196 C120,194 150,178 185,100 S250,6 370,4" fill="none" stroke="url(#curve)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <!-- players -->
    <circle cx="70" cy="190" r="7" fill="#22F0A3"/>
    <circle cx="120" cy="178" r="7" fill="#22F0A3"/>
    <circle cx="160" cy="150" r="7" fill="#22F0A3"/>
    <circle cx="225" cy="45" r="7" fill="#FF2D55"/>
    <circle cx="300" cy="12" r="9" fill="#FF2D55" class="pulse" filter="url(#glow)"/>
    <g transform="translate(206,128)">
      <rect width="150" height="54" rx="10" fill="#1F1438" stroke="#FFC53D"/>
      <text class="mono" x="12" y="21" font-size="11" fill="#FFC53D">DERYA · SUPPORT</text>
      <text class="sans" x="12" y="41" font-size="13" fill="#EDEBFF">Slow down 10 s…</text>
    </g>
    <path d="M296,22 L296,120" stroke="#FFC53D" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>
    <text class="mono" x="0" y="222" font-size="11" fill="#5F5994">steady play</text>
    <text class="mono" x="370" y="222" font-size="11" fill="#5F5994" text-anchor="end">struggling play</text>
  </g>
</g>
</svg>
